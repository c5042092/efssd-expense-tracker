{% extends "base.html" %}

{% block content %}

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card shadow-sm border-0 w-100" style="max-width: 420px;">
        <div class="card-body p-4">
            <!-- Brand -->
            <div class="text-center mb-4">
                <h1 class="h4 mb-1">Welcome back</h1>
                <p class="text-muted small mb-0">
                    Please sign in to continue
                </p>
            </div>

            <!-- Form -->
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input name="email" type="email" id="email" class="form-control" placeholder="name@company.com"
                        autocomplete="email" value="{{ request.form.get('email', '') }}">
                    <div class="text-danger small mt-1" id="emailError"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input name="password" type="password" id="password" class="form-control" placeholder="Enter your password"
                        autocomplete="current-password">
                    <div class="text-danger small mt-1" id="passwordError"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <!-- <a href="#" class="small text-decoration-none">
                        Forgot password?
                    </a> -->

                </div>
                <button type="submit" class="btn btn-primary w-100">
                    Sign in
                </button>
            </form>

            <!-- Signup -->
            <div class="text-center mt-4">
                <p class="small mb-0">
                    Don't have an account?
                    <a href="{{ url_for('auth.register')}}" class="text-decoration-none">Sign up</a>
                </p>
            </div>

        </div>
    </div>
</div>

{% endblock %}
